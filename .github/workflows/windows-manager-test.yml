name: Test Windows phone manager
on:
  push:
    branches: [main]
    paths: ['tests/windows_startup_smoke.py', '.github/workflows/windows-manager-test.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test tools
        run: python -m pip install playwright==1.58.0
      - name: Install Chromium
        run: python -m playwright install chromium
      - name: Run transfer, diagnostics, and Gemini contract tests
        run: python -m unittest discover -s tests -v
      - name: Start actual Windows CMD launcher and test the real HTTP interface
        run: python tests/windows_startup_smoke.py
      - name: Exercise diagnostic and Gemini UI with simulated services
        run: python tests/browser_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Windows-phone-manager-test-results
          path: test-output/
